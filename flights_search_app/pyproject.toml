[project]
name = "flights-search-app"
version = "0.1.0"
description = "Flights Search ADK Agent Application"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "google-adk==2.11.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "google-genai==2.31.0",
    "requests==2.32.5",
    "coloredlogs==15.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--import-mode=importlib"
log_cli = true
log_cli_level = "INFO"
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\] feature FeatureName.PLUGGABLE_AUTH is enabled:UserWarning",
    "ignore:Inheritance class AiohttpClientSession from ClientSession is discouraged:DeprecationWarning",
]
