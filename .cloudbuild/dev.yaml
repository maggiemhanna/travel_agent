# ==============================================================================
# End-to-End CI/CD + Terraform + Cloud Run Deployment Pipeline
# Supports dev (travel-agent-511710), staging (travel-agent-staging-51221),
# and prod (travel-agent-prod-512211) with full environment parity.
# ==============================================================================
substitutions:
  _ENV: 'dev'
  _REGION: 'europe-west9'
  _SECONDARY_REGION: ''
  _REPOSITORY_ID: 'travel-agent'
  _IMAGE_TAG: 'latest'

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Run Backend Unit Tests (CI Gate)
  # ----------------------------------------------------------------------------
  - id: 'ci-unit-tests'
    name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        pip install --no-cache-dir \
          google-cloud-aiplatform==1.148.1 \
          pandas==3.0.6 \
          tqdm==4.70.1
        pip install --no-cache-dir \
          -r flights_search_app/requirements.txt \
          -r conversational_app/requirements.txt \
          pytest==9.0.2 \
          httpx==0.28.1
        (cd flights_search_app && pytest tests/unit -q)
        (cd conversational_app && pytest tests/unit -q)

  # ----------------------------------------------------------------------------
  # Step 2: Terraform Bootstrap Infrastructure (APIs, IAM, Artifact Registry)
  # ----------------------------------------------------------------------------
  - id: 'terraform-bootstrap-infra'
    name: 'hashicorp/terraform:1.9.8'
    dir: 'deployment/terraform'
    waitFor: ['ci-unit-tests']
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        terraform init -reconfigure \
          -backend-config="bucket=${PROJECT_ID}-tfstate" \
          -backend-config="prefix=travel-agent/${_ENV}"

        terraform apply -auto-approve -lock-timeout=5m \
          -var-file="envs/${_ENV}.tfvars" \
          -var="project_id=${PROJECT_ID}" \
          -var="region=${_REGION}" \
          -var="secondary_region=${_SECONDARY_REGION}" \
          -var="repository_id=${_REPOSITORY_ID}" \
          -var="image_tag=${_IMAGE_TAG}" \
          -target=google_project_service.required_apis \
          -target=google_artifact_registry_repository.docker_repo \
          -target=google_artifact_registry_repository.docker_repo_secondary \
          -target=google_service_account.agent_runtime \
          -target=google_project_iam_member.agent_runtime_roles \
          -target=google_service_account.frontend_runtime \
          -target=google_project_iam_member.frontend_runtime_roles \
          -target=google_service_account_iam_member.cicd_act_as_runtime \
          -target=google_service_account_iam_member.cicd_act_as_frontend

  # ----------------------------------------------------------------------------
  # Step 3a: Build & Push flights-search-app Image
  # ----------------------------------------------------------------------------
  - id: 'build-push-flights-search'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['terraform-bootstrap-infra']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY_ID}/flights-search-app"
        docker pull "$${IMAGE_URI}:latest" || true
        docker build \
          --cache-from "$${IMAGE_URI}:latest" \
          -t "$${IMAGE_URI}:${_IMAGE_TAG}" \
          -t "$${IMAGE_URI}:latest" \
          flights_search_app/
        docker push "$${IMAGE_URI}:${_IMAGE_TAG}"
        docker push "$${IMAGE_URI}:latest"
        if [[ -n "${_SECONDARY_REGION}" && "${_SECONDARY_REGION}" != "${_REGION}" ]]; then
          SECONDARY_URI="${_SECONDARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY_ID}/flights-search-app"
          docker tag "$${IMAGE_URI}:${_IMAGE_TAG}" "$${SECONDARY_URI}:${_IMAGE_TAG}"
          docker tag "$${IMAGE_URI}:latest" "$${SECONDARY_URI}:latest"
          docker push "$${SECONDARY_URI}:${_IMAGE_TAG}"
          docker push "$${SECONDARY_URI}:latest"
        fi

  # ----------------------------------------------------------------------------
  # Step 3b: Build & Push conversational-app Image
  # ----------------------------------------------------------------------------
  - id: 'build-push-conversational'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['terraform-bootstrap-infra']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY_ID}/conversational-app"
        docker pull "$${IMAGE_URI}:latest" || true
        docker build \
          --cache-from "$${IMAGE_URI}:latest" \
          -t "$${IMAGE_URI}:${_IMAGE_TAG}" \
          -t "$${IMAGE_URI}:latest" \
          conversational_app/
        docker push "$${IMAGE_URI}:${_IMAGE_TAG}"
        docker push "$${IMAGE_URI}:latest"
        if [[ -n "${_SECONDARY_REGION}" && "${_SECONDARY_REGION}" != "${_REGION}" ]]; then
          SECONDARY_URI="${_SECONDARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY_ID}/conversational-app"
          docker tag "$${IMAGE_URI}:${_IMAGE_TAG}" "$${SECONDARY_URI}:${_IMAGE_TAG}"
          docker tag "$${IMAGE_URI}:latest" "$${SECONDARY_URI}:latest"
          docker push "$${SECONDARY_URI}:${_IMAGE_TAG}"
          docker push "$${SECONDARY_URI}:latest"
        fi

  # ----------------------------------------------------------------------------
  # Step 3c: Build & Push frontend Image
  # ----------------------------------------------------------------------------
  - id: 'build-push-frontend'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['terraform-bootstrap-infra']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY_ID}/frontend"
        docker pull "$${IMAGE_URI}:latest" || true
        docker build \
          --cache-from "$${IMAGE_URI}:latest" \
          -t "$${IMAGE_URI}:${_IMAGE_TAG}" \
          -t "$${IMAGE_URI}:latest" \
          frontend/
        docker push "$${IMAGE_URI}:${_IMAGE_TAG}"
        docker push "$${IMAGE_URI}:latest"
        if [[ -n "${_SECONDARY_REGION}" && "${_SECONDARY_REGION}" != "${_REGION}" ]]; then
          SECONDARY_URI="${_SECONDARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY_ID}/frontend"
          docker tag "$${IMAGE_URI}:${_IMAGE_TAG}" "$${SECONDARY_URI}:${_IMAGE_TAG}"
          docker tag "$${IMAGE_URI}:latest" "$${SECONDARY_URI}:latest"
          docker push "$${SECONDARY_URI}:${_IMAGE_TAG}"
          docker push "$${SECONDARY_URI}:latest"
        fi

  # ----------------------------------------------------------------------------
  # Step 4: Terraform Apply Cloud Run Services & Output Live Service URLs
  # ----------------------------------------------------------------------------
  - id: 'terraform-deploy-cloud-run'
    name: 'hashicorp/terraform:1.9.8'
    dir: 'deployment/terraform'
    waitFor:
      - 'build-push-flights-search'
      - 'build-push-conversational'
      - 'build-push-frontend'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        terraform apply -auto-approve -lock-timeout=5m \
          -var-file="envs/${_ENV}.tfvars" \
          -var="project_id=${PROJECT_ID}" \
          -var="region=${_REGION}" \
          -var="secondary_region=${_SECONDARY_REGION}" \
          -var="repository_id=${_REPOSITORY_ID}" \
          -var="image_tag=${_IMAGE_TAG}" \
          -var="deploy_cloud_run_services=true"

        FLIGHTS_URL=$$(terraform output -raw flights_search_url)
        CONVERSATIONAL_URL=$$(terraform output -raw conversational_url)
        FRONTEND_URL=$$(terraform output -raw frontend_url)
        FLIGHTS_SECONDARY_URL=$$(terraform output -raw flights_search_secondary_url 2>/dev/null || true)
        CONVERSATIONAL_SECONDARY_URL=$$(terraform output -raw conversational_secondary_url 2>/dev/null || true)
        FRONTEND_SECONDARY_URL=$$(terraform output -raw frontend_secondary_url 2>/dev/null || true)

        cat <<EOF > /workspace/service_urls.env
        FLIGHTS_SEARCH_URL="$${FLIGHTS_URL}"
        CONVERSATIONAL_URL="$${CONVERSATIONAL_URL}"
        FRONTEND_URL="$${FRONTEND_URL}"
        FLIGHTS_SEARCH_SECONDARY_URL="$${FLIGHTS_SECONDARY_URL}"
        CONVERSATIONAL_SECONDARY_URL="$${CONVERSATIONAL_SECONDARY_URL}"
        FRONTEND_SECONDARY_URL="$${FRONTEND_SECONDARY_URL}"
        EOF

        echo "=================================================================="
        echo "Deployed Cloud Run Services (${_ENV} -> ${PROJECT_ID}):"
        echo "  Flights Search App : $${FLIGHTS_URL}"
        echo "  Conversational App : $${CONVERSATIONAL_URL}"
        echo "  Frontend           : $${FRONTEND_URL}"
        if [ -n "$${FLIGHTS_SECONDARY_URL}" ]; then
          echo "  [Secondary] Flights Search App : $${FLIGHTS_SECONDARY_URL}"
          echo "  [Secondary] Conversational App : $${CONVERSATIONAL_SECONDARY_URL}"
          echo "  [Secondary] Frontend           : $${FRONTEND_SECONDARY_URL}"
        fi
        echo "=================================================================="

  # ----------------------------------------------------------------------------
  # Step 5: Post-Deploy Smoke & Readiness Verification
  # ----------------------------------------------------------------------------
  - id: 'smoke-test-services'
    name: 'gcr.io/cloud-builders/curl'
    waitFor: ['terraform-deploy-cloud-run']
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        . /workspace/service_urls.env

        # Note: Google Front End (GFE) reserves /healthz on external *.run.app URLs,
        # so external smoke checks probe /readyz (and / for backend services) while
        # Cloud Run's internal liveness probe checks /healthz directly on port 8080.
        echo "Verifying Flights Search Service probes ($${FLIGHTS_SEARCH_URL})..."
        curl -fsS --retry 5 --retry-delay 3 "$${FLIGHTS_SEARCH_URL}/"
        echo ""
        curl -fsS --retry 5 --retry-delay 3 "$${FLIGHTS_SEARCH_URL}/readyz"
        echo ""

        echo "Verifying Conversational Service probes ($${CONVERSATIONAL_URL})..."
        curl -fsS --retry 5 --retry-delay 3 "$${CONVERSATIONAL_URL}/"
        echo ""
        curl -fsS --retry 5 --retry-delay 3 "$${CONVERSATIONAL_URL}/readyz"
        echo ""

        echo "Verifying Frontend probes & runtime env-config ($${FRONTEND_URL})..."
        curl -fsS --retry 5 --retry-delay 3 "$${FRONTEND_URL}/readyz"
        echo ""
        curl -fsS --retry 5 --retry-delay 3 "$${FRONTEND_URL}/env-config.js"
        echo ""

        if [ -n "$${FLIGHTS_SEARCH_SECONDARY_URL}" ]; then
          echo "Verifying Warm Secondary Region Services..."
          curl -fsS --retry 5 --retry-delay 3 "$${FLIGHTS_SEARCH_SECONDARY_URL}/"
          curl -fsS --retry 5 --retry-delay 3 "$${FLIGHTS_SEARCH_SECONDARY_URL}/readyz"
          curl -fsS --retry 5 --retry-delay 3 "$${CONVERSATIONAL_SECONDARY_URL}/"
          curl -fsS --retry 5 --retry-delay 3 "$${CONVERSATIONAL_SECONDARY_URL}/readyz"
          curl -fsS --retry 5 --retry-delay 3 "$${FRONTEND_SECONDARY_URL}/readyz"
          curl -fsS --retry 5 --retry-delay 3 "$${FRONTEND_SECONDARY_URL}/env-config.js"
          echo ""
        fi
        echo "✅ All Cloud Run services passed post-deploy liveness & readiness smoke verification!"

options:
  logging: CLOUD_LOGGING_ONLY
timeout: '1800s'
