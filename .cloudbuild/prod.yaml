# ==============================================================================
# Continuous Deployment (CD) — Production Pipeline (.cloudbuild/prod.yaml)
# Target Project : travel-agent-prod-512211
# Trigger        : Git Tag (`v*`) with Manual Approval Gate (or `./deployment/deploy.sh prod`)
# ==============================================================================
substitutions:
  _ENV: 'prod'
  _REGION: 'europe-west9'
  _SECONDARY_REGION: 'europe-west1'
  _REPOSITORY_ID: 'travel-agent'
  _IMAGE_TAG: 'latest'

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Run Backend Unit Tests (Pre-Release Safety Gate)
  # ----------------------------------------------------------------------------
  - id: 'ci-unit-tests'
    name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        pip install --no-cache-dir \
          -r flights_search_app/requirements.txt \
          -r conversational_app/requirements.txt \
          pytest==9.0.2 \
          httpx==0.28.1
        (cd flights_search_app && pytest tests/unit -q)
        (cd conversational_app && pytest tests/unit -q)

  # ----------------------------------------------------------------------------
  # Step 2: Terraform Bootstrap Prod Infra (APIs, IAM, Primary & Secondary AR)
  # ----------------------------------------------------------------------------
  - id: 'terraform-bootstrap-prod'
    name: 'hashicorp/terraform:1.9.8'
    dir: 'deployment/terraform'
    waitFor: ['ci-unit-tests']
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        TAG="${TAG_NAME:-${SHORT_SHA:-${_IMAGE_TAG}}}"
        terraform init -reconfigure \
          -backend-config="bucket=${PROJECT_ID}-tfstate" \
          -backend-config="prefix=travel-agent/${_ENV}"

        terraform apply -auto-approve -lock-timeout=5m \
          -var-file="envs/${_ENV}.tfvars" \
          -var="project_id=${PROJECT_ID}" \
          -var="region=${_REGION}" \
          -var="secondary_region=${_SECONDARY_REGION}" \
          -var="repository_id=${_REPOSITORY_ID}" \
          -var="image_tag=$${TAG}" \
          -target=google_project_service.required_apis \
          -target=google_artifact_registry_repository.docker_repo \
          -target=google_artifact_registry_repository.docker_repo_secondary \
          -target=google_service_account.agent_runtime \
          -target=google_project_iam_member.agent_runtime_roles \
          -target=google_service_account.frontend_runtime \
          -target=google_project_iam_member.frontend_runtime_roles \
          -target=google_service_account_iam_member.cicd_act_as_runtime \
          -target=google_service_account_iam_member.cicd_act_as_frontend

  # ----------------------------------------------------------------------------
  # Step 3a: Build & Push Release Image — flights-search-app (Primary & Secondary)
  # ----------------------------------------------------------------------------
  - id: 'build-push-flights-search'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['terraform-bootstrap-prod']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        TAG="${TAG_NAME:-${SHORT_SHA:-${_IMAGE_TAG}}}"
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY_ID}/flights-search-app"
        docker pull "$${IMAGE_URI}:latest" || true
        docker build \
          --cache-from "$${IMAGE_URI}:latest" \
          -t "$${IMAGE_URI}:$${TAG}" \
          -t "$${IMAGE_URI}:latest" \
          flights_search_app/
        docker push "$${IMAGE_URI}:$${TAG}"
        docker push "$${IMAGE_URI}:latest"
        if [[ -n "${_SECONDARY_REGION}" && "${_SECONDARY_REGION}" != "${_REGION}" ]]; then
          SECONDARY_URI="${_SECONDARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY_ID}/flights-search-app"
          docker tag "$${IMAGE_URI}:$${TAG}" "$${SECONDARY_URI}:$${TAG}"
          docker tag "$${IMAGE_URI}:latest" "$${SECONDARY_URI}:latest"
          docker push "$${SECONDARY_URI}:$${TAG}"
          docker push "$${SECONDARY_URI}:latest"
        fi

  # ----------------------------------------------------------------------------
  # Step 3b: Build & Push Release Image — conversational-app (Primary & Secondary)
  # ----------------------------------------------------------------------------
  - id: 'build-push-conversational'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['terraform-bootstrap-prod']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        TAG="${TAG_NAME:-${SHORT_SHA:-${_IMAGE_TAG}}}"
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY_ID}/conversational-app"
        docker pull "$${IMAGE_URI}:latest" || true
        docker build \
          --cache-from "$${IMAGE_URI}:latest" \
          -t "$${IMAGE_URI}:$${TAG}" \
          -t "$${IMAGE_URI}:latest" \
          conversational_app/
        docker push "$${IMAGE_URI}:$${TAG}"
        docker push "$${IMAGE_URI}:latest"
        if [[ -n "${_SECONDARY_REGION}" && "${_SECONDARY_REGION}" != "${_REGION}" ]]; then
          SECONDARY_URI="${_SECONDARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY_ID}/conversational-app"
          docker tag "$${IMAGE_URI}:$${TAG}" "$${SECONDARY_URI}:$${TAG}"
          docker tag "$${IMAGE_URI}:latest" "$${SECONDARY_URI}:latest"
          docker push "$${SECONDARY_URI}:$${TAG}"
          docker push "$${SECONDARY_URI}:latest"
        fi

  # ----------------------------------------------------------------------------
  # Step 3c: Build & Push Release Image — frontend (Primary & Secondary)
  # ----------------------------------------------------------------------------
  - id: 'build-push-frontend'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['terraform-bootstrap-prod']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        TAG="${TAG_NAME:-${SHORT_SHA:-${_IMAGE_TAG}}}"
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY_ID}/frontend"
        docker pull "$${IMAGE_URI}:latest" || true
        docker build \
          --cache-from "$${IMAGE_URI}:latest" \
          -t "$${IMAGE_URI}:$${TAG}" \
          -t "$${IMAGE_URI}:latest" \
          frontend/
        docker push "$${IMAGE_URI}:$${TAG}"
        docker push "$${IMAGE_URI}:latest"
        if [[ -n "${_SECONDARY_REGION}" && "${_SECONDARY_REGION}" != "${_REGION}" ]]; then
          SECONDARY_URI="${_SECONDARY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY_ID}/frontend"
          docker tag "$${IMAGE_URI}:$${TAG}" "$${SECONDARY_URI}:$${TAG}"
          docker tag "$${IMAGE_URI}:latest" "$${SECONDARY_URI}:latest"
          docker push "$${SECONDARY_URI}:$${TAG}"
          docker push "$${SECONDARY_URI}:latest"
        fi

  # ----------------------------------------------------------------------------
  # Step 4: Terraform Deploy Production Cloud Run Services (N+1 Primary + Warm Secondary)
  # ----------------------------------------------------------------------------
  - id: 'terraform-deploy-prod'
    name: 'hashicorp/terraform:1.9.8'
    dir: 'deployment/terraform'
    waitFor:
      - 'build-push-flights-search'
      - 'build-push-conversational'
      - 'build-push-frontend'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        TAG="${TAG_NAME:-${SHORT_SHA:-${_IMAGE_TAG}}}"
        terraform apply -auto-approve -lock-timeout=5m \
          -var-file="envs/${_ENV}.tfvars" \
          -var="project_id=${PROJECT_ID}" \
          -var="region=${_REGION}" \
          -var="secondary_region=${_SECONDARY_REGION}" \
          -var="repository_id=${_REPOSITORY_ID}" \
          -var="image_tag=$${TAG}" \
          -var="deploy_cloud_run_services=true"

        FLIGHTS_URL=$$(terraform output -raw flights_search_url)
        CONVERSATIONAL_URL=$$(terraform output -raw conversational_url)
        FRONTEND_URL=$$(terraform output -raw frontend_url)
        FLIGHTS_SECONDARY_URL=$$(terraform output -raw flights_search_secondary_url 2>/dev/null || true)
        CONVERSATIONAL_SECONDARY_URL=$$(terraform output -raw conversational_secondary_url 2>/dev/null || true)
        FRONTEND_SECONDARY_URL=$$(terraform output -raw frontend_secondary_url 2>/dev/null || true)

        cat <<EOF > /workspace/service_urls.env
        FLIGHTS_SEARCH_URL="$${FLIGHTS_URL}"
        CONVERSATIONAL_URL="$${CONVERSATIONAL_URL}"
        FRONTEND_URL="$${FRONTEND_URL}"
        FLIGHTS_SEARCH_SECONDARY_URL="$${FLIGHTS_SECONDARY_URL}"
        CONVERSATIONAL_SECONDARY_URL="$${CONVERSATIONAL_SECONDARY_URL}"
        FRONTEND_SECONDARY_URL="$${FRONTEND_SECONDARY_URL}"
        EOF

        echo "=================================================================="
        echo "Deployed Cloud Run Services (PRODUCTION -> ${PROJECT_ID}):"
        echo "  [Primary ${_REGION}] Flights Search App : $${FLIGHTS_URL}"
        echo "  [Primary ${_REGION}] Conversational App : $${CONVERSATIONAL_URL}"
        echo "  [Primary ${_REGION}] Frontend           : $${FRONTEND_URL}"
        if [ -n "$${FLIGHTS_SECONDARY_URL}" ]; then
          echo "  [Secondary ${_SECONDARY_REGION}] Flights Search App : $${FLIGHTS_SECONDARY_URL}"
          echo "  [Secondary ${_SECONDARY_REGION}] Conversational App : $${CONVERSATIONAL_SECONDARY_URL}"
          echo "  [Secondary ${_SECONDARY_REGION}] Frontend           : $${FRONTEND_SECONDARY_URL}"
        fi
        echo "=================================================================="

  # ----------------------------------------------------------------------------
  # Step 5: Post-Deploy Production Smoke & Readiness Verification
  # ----------------------------------------------------------------------------
  - id: 'smoke-test-prod'
    name: 'gcr.io/cloud-builders/curl'
    waitFor: ['terraform-deploy-prod']
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        . /workspace/service_urls.env

        echo "Verifying Production Primary Flights Search Service ($${FLIGHTS_SEARCH_URL})..."
        curl -fsS --retry 5 --retry-delay 3 "$${FLIGHTS_SEARCH_URL}/healthz"
        echo ""
        curl -fsS --retry 5 --retry-delay 3 "$${FLIGHTS_SEARCH_URL}/readyz"
        echo ""

        echo "Verifying Production Primary Conversational Service ($${CONVERSATIONAL_URL})..."
        curl -fsS --retry 5 --retry-delay 3 "$${CONVERSATIONAL_URL}/healthz"
        echo ""
        curl -fsS --retry 5 --retry-delay 3 "$${CONVERSATIONAL_URL}/readyz"
        echo ""

        echo "Verifying Production Primary Frontend & runtime env-config ($${FRONTEND_URL})..."
        curl -fsS --retry 5 --retry-delay 3 "$${FRONTEND_URL}/healthz"
        echo ""
        curl -fsS --retry 5 --retry-delay 3 "$${FRONTEND_URL}/readyz"
        echo ""
        PRIMARY_ENV_CFG=$$(curl -fsS --retry 5 --retry-delay 3 "$${FRONTEND_URL}/env-config.js")
        echo "$${PRIMARY_ENV_CFG}"
        echo "$${PRIMARY_ENV_CFG}" | grep -F "VITE_FLIGHTS_SEARCH_API_URL: \"$${FLIGHTS_SEARCH_URL}\""
        echo "$${PRIMARY_ENV_CFG}" | grep -F "VITE_CONVERSATIONAL_API_URL: \"$${CONVERSATIONAL_URL}\""

        if [ -n "$${FLIGHTS_SEARCH_SECONDARY_URL}" ]; then
          echo "Verifying Primary Frontend cross-region fallback URL wiring..."
          echo "$${PRIMARY_ENV_CFG}" | grep -F "VITE_FLIGHTS_SEARCH_FALLBACK_API_URL: \"$${FLIGHTS_SEARCH_SECONDARY_URL}\""
          echo "$${PRIMARY_ENV_CFG}" | grep -F "VITE_CONVERSATIONAL_FALLBACK_API_URL: \"$${CONVERSATIONAL_SECONDARY_URL}\""

          echo "Verifying Production Warm Secondary Region Services..."
          curl -fsS --retry 5 --retry-delay 3 "$${FLIGHTS_SEARCH_SECONDARY_URL}/healthz"
          curl -fsS --retry 5 --retry-delay 3 "$${FLIGHTS_SEARCH_SECONDARY_URL}/readyz"
          curl -fsS --retry 5 --retry-delay 3 "$${CONVERSATIONAL_SECONDARY_URL}/healthz"
          curl -fsS --retry 5 --retry-delay 3 "$${CONVERSATIONAL_SECONDARY_URL}/readyz"
          curl -fsS --retry 5 --retry-delay 3 "$${FRONTEND_SECONDARY_URL}/healthz"
          curl -fsS --retry 5 --retry-delay 3 "$${FRONTEND_SECONDARY_URL}/readyz"
          SECONDARY_ENV_CFG=$$(curl -fsS --retry 5 --retry-delay 3 "$${FRONTEND_SECONDARY_URL}/env-config.js")
          echo "$${SECONDARY_ENV_CFG}"
          echo "$${SECONDARY_ENV_CFG}" | grep -F "VITE_FLIGHTS_SEARCH_API_URL: \"$${FLIGHTS_SEARCH_SECONDARY_URL}\""
          echo "$${SECONDARY_ENV_CFG}" | grep -F "VITE_CONVERSATIONAL_API_URL: \"$${CONVERSATIONAL_SECONDARY_URL}\""
          echo "$${SECONDARY_ENV_CFG}" | grep -F "VITE_FLIGHTS_SEARCH_FALLBACK_API_URL: \"$${FLIGHTS_SEARCH_URL}\""
          echo "$${SECONDARY_ENV_CFG}" | grep -F "VITE_CONVERSATIONAL_FALLBACK_API_URL: \"$${CONVERSATIONAL_URL}\""
        fi
        echo "✅ Production primary & secondary release and cross-region fallback wiring verified successfully!"

options:
  logging: CLOUD_LOGGING_ONLY
timeout: '1800s'
