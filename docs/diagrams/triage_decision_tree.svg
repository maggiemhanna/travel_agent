<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-label="Symptom-Driven Fast Triage Decision Tree">
  <defs>
    <marker id="tr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="976" height="476" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="490" y="30" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">
    Fast Triage Decision Tree — Locate the Right Layer &amp; Runbook in &lt; 30 Seconds
  </text>

  <!-- Top Root Box -->
  <rect x="330" y="48" width="320" height="46" rx="10" fill="#0f172a"/>
  <text x="490" y="70" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
    Observed Error, Alert, or Regression
  </text>
  <text x="490" y="86" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#cbd5e1">
    Where does the failure surface?
  </text>

  <!-- Branch Lines to 3 Columns -->
  <path d="M 490 94 L 490 118" fill="none" stroke="#475569" stroke-width="1.8"/>
  <path d="M 172 118 L 808 118" fill="none" stroke="#475569" stroke-width="1.8"/>
  <line x1="172" y1="118" x2="172" y2="140" stroke="#475569" stroke-width="1.8" marker-end="url(#tr-arrow)"/>
  <line x1="490" y1="118" x2="490" y2="140" stroke="#475569" stroke-width="1.8" marker-end="url(#tr-arrow)"/>
  <line x1="808" y1="118" x2="808" y2="140" stroke="#475569" stroke-width="1.8" marker-end="url(#tr-arrow)"/>

  <!-- Column 1: CI/CD & Terraform -->
  <rect x="22" y="144" width="300" height="314" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <rect x="22" y="144" width="300" height="34" rx="8" fill="#1d4ed8"/>
  <text x="172" y="166" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">
    A. CI/CD or Terraform Build
  </text>

  <!-- Card A1 -->
  <rect x="36" y="192" width="272" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="48" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af">
    Stage 1 Fails (pytest / OpenAPI)
  </text>
  <text x="48" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    Schema edited without export_openapi
  </text>
  <text x="48" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563eb">
    -&gt; Layer 4 (§6.1) + Runbook RB-08
  </text>

  <!-- Card A2 -->
  <rect x="36" y="276" width="272" height="78" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="48" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af">
    Stage 2 or 4 Fails (Terraform / IAM)
  </text>
  <text x="48" y="314" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    .tflock lock, state prefix, or deletion guard
  </text>
  <text x="48" y="332" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563eb">
    -&gt; Layer 4 (§6.2–§6.5) + Runbook RB-04
  </text>

  <!-- Card A3 -->
  <rect x="36" y="366" width="272" height="78" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="48" y="386" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af">
    Stage 5 Fails (Smoke Test curl)
  </text>
  <text x="48" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    /readyz HTTP 503 or /env-config.js mismatch
  </text>
  <text x="48" y="422" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563eb">
    -&gt; Layer 1 (§3.1–§3.3) + Runbook RB-01
  </text>

  <!-- Column 2: Live Cloud Run / Browser -->
  <rect x="340" y="144" width="300" height="314" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
  <rect x="340" y="144" width="300" height="34" rx="8" fill="#dc2626"/>
  <text x="490" y="166" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">
    B. Live Cloud Run / Web Browser
  </text>

  <!-- Card B1 -->
  <rect x="354" y="190" width="272" height="58" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="366" y="209" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#991b1b">
    HTTP 503 on GET /readyz
  </text>
  <text x="366" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#334155">
    Missing Vertex env vars or /env-config.js
  </text>
  <text x="366" y="241" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="700" fill="#dc2626">
    -&gt; Layer 1 (§3.1–§3.3)
  </text>

  <!-- Card B2 -->
  <rect x="354" y="256" width="272" height="60" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="366" y="275" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#991b1b">
    Slow (&gt;60s) or HTTP 500 on /api/v1/*
  </text>
  <text x="366" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#334155">
    Vertex AI 429/403 or both models failed
  </text>
  <text x="366" y="308" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="700" fill="#dc2626">
    -&gt; Layer 2 (§4.1–§4.5) + RB-01 / RB-03
  </text>

  <!-- Card B3 -->
  <rect x="354" y="324" width="272" height="60" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="366" y="343" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#991b1b">
    CORS Blocked or [RegionalFailover] Warn
  </text>
  <text x="366" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#334155">
    ALLOWED_ORIGINS or Paris region degraded
  </text>
  <text x="366" y="376" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="700" fill="#dc2626">
    -&gt; Layer 3 (§5.1–§5.2) + Runbook RB-02
  </text>

  <!-- Card B4 -->
  <rect x="354" y="392" width="272" height="54" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="366" y="411" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#991b1b">
    HTTP 422 Unprocessable Entity
  </text>
  <text x="366" y="427" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#334155">
    Input guardrail rejected -&gt; Layer 3 (§5.3)
  </text>

  <!-- Column 3: Local Workstation & Eval -->
  <rect x="658" y="144" width="300" height="314" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <rect x="658" y="144" width="300" height="34" rx="8" fill="#0f766e"/>
  <text x="808" y="166" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">
    C. Local Dev, E2E &amp; GEAP Eval
  </text>

  <!-- Card C1 -->
  <rect x="672" y="192" width="272" height="72" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.4"/>
  <text x="684" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">
    DefaultCredentialsError / 403
  </text>
  <text x="684" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    Local ADC expired or wrong GCP project
  </text>
  <text x="684" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0d9488">
    -&gt; Layer 5 (§7.1) gcloud auth ADC login
  </text>

  <!-- Card C2 -->
  <rect x="672" y="276" width="272" height="78" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.4"/>
  <text x="684" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">
    Port In Use / E2E ConnectionError
  </text>
  <text x="684" y="314" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    Stale uvicorn or unstarted :8002–:8006 server
  </text>
  <text x="684" y="332" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0d9488">
    -&gt; Layer 5 (§7.2–§7.4)
  </text>

  <!-- Card C3 -->
  <rect x="672" y="366" width="272" height="78" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.4"/>
  <text x="684" y="386" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">
    Eval ImportError or Backup Prefix
  </text>
  <text x="684" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    Missing eval extras or state/ vs &lt;env&gt;/ path
  </text>
  <text x="684" y="422" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0d9488">
    -&gt; Layer 5 (§7.5–§7.6) + Runbook RB-09
  </text>
</svg>
