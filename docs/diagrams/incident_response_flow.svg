<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 235" width="980" height="235" role="img" aria-label="Standard 5-Step Operational Runbook Execution Flow">
  <defs>
    <marker id="rb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="976" height="231" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="490" y="30" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">
    Uniform 5-Step Runbook Execution Lifecycle (Used Across RB-01 through RB-09)
  </text>

  <!-- Step 1 -->
  <rect x="22" y="54" width="170" height="142" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="22" y="54" width="170" height="28" rx="8" fill="#dc2626"/>
  <text x="107" y="73" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">
    1. Impact &amp; Context
  </text>
  <text x="107" y="104" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    Assess blast radius &amp;
  </text>
  <text x="107" y="122" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    check active auto-healing
  </text>
  <text x="107" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">
    (Regional / Model failover)
  </text>
  <text x="107" y="174" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#dc2626">
    Classify SEV-1..SEV-4
  </text>

  <line x1="192" y1="125" x2="212" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#rb-arrow)"/>

  <!-- Step 2 -->
  <rect x="216" y="54" width="170" height="142" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="216" y="54" width="170" height="28" rx="8" fill="#334155"/>
  <text x="301" y="73" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">
    2. Preconditions
  </text>
  <text x="301" y="104" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    Export PROJECT_ID,
  </text>
  <text x="301" y="122" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    PRIMARY_REGION &amp; IAM
  </text>
  <text x="301" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">
    Confirm safe build state
  </text>
  <text x="301" y="174" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#334155">
    Copy-pasteable env vars
  </text>

  <line x1="386" y1="125" x2="406" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#rb-arrow)"/>

  <!-- Step 3 -->
  <rect x="410" y="54" width="170" height="142" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="410" y="54" width="170" height="28" rx="8" fill="#1d4ed8"/>
  <text x="495" y="73" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">
    3. Execute SOP
  </text>
  <text x="495" y="104" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    Mitigate immediately
  </text>
  <text x="495" y="122" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    (Traffic pin, scale standby,
  </text>
  <text x="495" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">
    model swap, or unlock)
  </text>
  <text x="495" y="174" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">
    Fast MTTR (&lt; 2–15 min)
  </text>

  <line x1="580" y1="125" x2="600" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#rb-arrow)"/>

  <!-- Step 4 -->
  <rect x="604" y="54" width="170" height="142" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="604" y="54" width="170" height="28" rx="8" fill="#059669"/>
  <text x="689" y="73" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">
    4. Verify Health
  </text>
  <text x="689" y="104" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    Run validate_dr.sh,
  </text>
  <text x="689" y="122" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    check /readyz == 200 &amp;
  </text>
  <text x="689" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">
    zero new 5xx logs
  </text>
  <text x="689" y="174" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669">
    Objective exit criteria
  </text>

  <line x1="774" y1="125" x2="794" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#rb-arrow)"/>

  <!-- Step 5 -->
  <rect x="798" y="54" width="160" height="142" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="798" y="54" width="160" height="28" rx="8" fill="#0f766e"/>
  <text x="878" y="73" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">
    5. Follow-Up &amp; IaC
  </text>
  <text x="878" y="104" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    Persist overrides in
  </text>
  <text x="878" y="122" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    .tfvars / Git &amp; run
  </text>
  <text x="878" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">
    deploy.sh or escalate
  </text>
  <text x="878" y="174" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0f766e">
    Zero Terraform drift
  </text>

  <!-- Footer -->
  <text x="490" y="218" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#64748b">
    Important: Any emergency gcloud run services update / update-traffic override must be converged back into Git + Terraform in Step 5.
  </text>
</svg>
